<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>

<script>
const NAV=[['overview','概览'],['keys','Key 与模型'],['priority','路由优先级'],['settings','设置']];
const TITLE={overview:'概览',keys:'Key 与模型',priority:'路由优先级',settings:'设置'};
const ICONS={
  overview:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',

  power:'<path d="M12 2v10M6 5a9 9 0 1 0 12 0"/>',
  stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
  direct:'<path d="M4 17v-4a5 5 0 0 1 5-5h11m-5-5 5 5-5 5"/>',
  plus:'<path d="M12 4v16M4 12h16"/>',
  edit:'<path d="m16 3 5 5-13 13H3v-5zM13 6l5 5"/>',
  trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',
  save:'<path d="M20 21H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h13l4 4v13a1 1 0 0 1-1 1zM7 3v6h9V3M7 21v-8h10v8"/>',
  folder:'<path d="M3 7V4h6l3 3h9v13H3z"/>',

  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 1v2M12 21v2M1 12h2M21 12h2M4 4l2 2M18 18l2 2M4 20l2-2M18 6l2-2"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.1"/>',
};
const NAV_ICONS={overview:['overview','blue'],keys:['key','violet'],priority:['route','cyan'],settings:['settings','amber']};
// 结构图标使用确认图的实体形状；操作图标保持线性，分工和比例由施工参数固定。
const TILE_ICONS={
  overview:ICONS.overview,
  key:'<path fill-rule="evenodd" d="M15.5 2.1a6 6 0 1 0 0 12 6 6 0 0 0 0-12Zm0 3.8a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4Z"/><path d="m11.4 12.2-6.8 6.8m.2-2.6 2.4 2.4" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>',
  route:'<path d="M3 18.5 7.8 13.7l-2-2 5.7-.8-.8 5.7-1.9-1.9-4.8 4.8zM10.7 11.3l5.1-5.1-2.1-2.1 7.3-1.1-1.1 7.3-2.1-2.1-5.1 5.1z"/>',
  settings:'<path fill-rule="evenodd" d="M9 2h6l.7 2.4 2.1 1.2 2.4-.5 3 5.2-1.7 1.7v2.4l1.7 1.7-3 5.2-2.4-.5-2.1 1.2L15 24H9l-.7-2.4-2.1-1.2-2.4.5-3-5.2L2.5 14v-2.4L.8 9.9l3-5.2 2.4.5 2.1-1.2Z M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" transform="translate(0 -1) scale(1 .96)"/>',
  models:'<path d="M11.1 3.6Q12 3.1 12.9 3.6L20.5 7.4Q21.5 7.9 20.5 8.4L12.9 12.2Q12 12.7 11.1 12.2L3.5 8.4Q2.5 7.9 3.5 7.4Z"/><path d="M3 12.8 12 17.3 21 12.8M3 17.1 12 21.6 21 17.1" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>',
  cloud:'<path d="M6 19a5 5 0 0 1-1.5-9.8A7.2 7.2 0 0 1 18 7.8a5.6 5.6 0 0 1 0 11.2Z" fill="#f8fcff"/><path d="m8.5 13 2.5 2.5 4.5-4.5" fill="none" stroke="var(--tile-low)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
};
function icon(name,tile=false){const solid=tile&&TILE_ICONS[name];return `<svg class="icon" viewBox="0 0 24 24" fill="${solid?'currentColor':'none'}" stroke="${solid?'none':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${solid||ICONS[name]}</svg>`;}
function iconTile(name,tone='blue'){return `<span class="icon-tile ${tone}">${icon(name,true)}</span>`;}
console.info('ui visual parameters revision=reference-v2 calibration=softlight');
let PAGE=new URLSearchParams(location.search).get('page')||'overview';
if(!TITLE[PAGE])PAGE='overview';
let PAGE_HTML=null; // 上一次真正画进 #page 的内容，5 秒轮询靠它判断要不要重建
let STATE=null;
let SELECTED_KEY=undefined; // undefined 仅表示尚未初始化，null 表示主动选中官方账号。
let DRAFT=null;
let PENDING_PRIORITY=null;
let SEARCH='';
let COMPOSING=false;
let BUSY=false;
let IMAGE_OFF=new Set();
let IMAGE_READY=false;
let OVERVIEW_SOURCE='official';
let RECENT_EVENTS_OPEN=false;
let SAVING_DOCK_VISIBILITY=false;
let DOCK_VISIBILITY_APPLIED=null;
let NAV_PAGE=null;
let DIAGNOSTICS_OPEN=false;
let CONTENT_SCROLLBAR_WIDTH=-1;

function syncContentGutter(){
  const page=document.getElementById('page');
  const width=page.offsetWidth-page.clientWidth;
  if(width===CONTENT_SCROLLBAR_WIDTH)return;
  CONTENT_SCROLLBAR_WIDTH=width;
  // 总右边距包含系统滚动条槽，四页与标题栏保持同一边缘。
  page.style.setProperty('--scrollbar-width',width+'px');
  console.info('ui content gutter scrollbar='+width+'px');
}
window.addEventListener('resize',syncContentGutter);

// 主题：默认浅色，设置存后端；localStorage 只做首屏防闪，后端返回后以其为准。
const THEME_KEY='codexmk.theme';
function applyTheme(theme){
  const name=theme==='dark'?'dark':'light';
  document.documentElement.setAttribute('data-theme',name);
}
function readThemeCache(){
  try{return localStorage.getItem(THEME_KEY)==='dark'?'dark':'light';}catch(e){return 'light';}
}
function writeThemeCache(theme){
  try{localStorage.setItem(THEME_KEY,theme==='dark'?'dark':'light');}catch(e){}
}
applyTheme(readThemeCache());

function syncDockVisibility(){
  if(!STATE||STATE.platform!=='macos')return;
  const handler=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.codexmkDockVisibility;
  if(!handler)return;
  const hidden=STATE.settings.hide_dock_icon!==false;
  if(DOCK_VISIBILITY_APPLIED===hidden)return;
  try{
    handler.postMessage(hidden);
    DOCK_VISIBILITY_APPLIED=hidden;
    console.info('ui dock visibility synced hidden='+hidden);
  }catch(e){console.warn('ui dock visibility sync failed',e);}
}

const ERROR_TEXT={
  key_not_found:'这个 Key 不存在，可能已被删除',
  key_missing:'这个 Key 还没填密钥',
  task_running:'已有任务在执行，请稍候',
  bad_order:'Key 顺序数据不完整，请刷新后重试',
  bad_priority:'优先级数据格式不对',
  invalid_keys:'Key 配置校验失败，请检查名称、密钥与上游地址',
  port_busy:'8790 端口被其他程序占用，请先关闭该程序',
  runtime_missing:'运行文件缺失，请先点“刷新模型列表”',
  forbidden_origin:'请求来源被拒绝（安全限制）',
  ui_missing:'界面文件缺失，请重新安装',
  operation_failed:'操作失败',
  internal_error:'内部错误',
  bad_json:'请求数据格式不对',
  bad_theme:'主题设置不正确',
  bad_dock_visibility:'程序坞图标设置不正确',
  macos_only:'此设置仅支持 macOS',
};

function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function appVersionText(state){return state&&state.app_version?'v'+String(state.app_version):'版本未知';}
function errText(data,fallback){
  const code=data&&data.code;
  if(code&&ERROR_TEXT[code])return ERROR_TEXT[code]+(data.error?'（'+data.error+'）':'');
  return (data&&data.error)||fallback||'操作失败';
}
function toast(message,kind){
  const box=document.getElementById('toast');
  const item=document.createElement('div');
  item.className=kind||'';
  item.textContent=message;
  box.appendChild(item);
  setTimeout(()=>item.remove(),kind==='err'?9000:4200);
}
async function api(path,options){
  const opts=Object.assign({headers:{}},options||{});
  if(opts.body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}
  let response;
  try{
    response=await fetch(path,opts);
  }catch(e){
    // WebKit reports refused/aborted connections as the bare English string
    // "Load failed"; show something readable and keep the raw error in console.
    console.warn('api request failed',path,e);
    const error=new Error('本地服务连接中断，请稍后重试');
    error.data=null;
    throw error;
  }
  let data=null;
  try{data=await response.json();}catch(e){data=null;}
  if(!response.ok||(data&&data.ok===false)){
    const message=errText(data,'HTTP '+response.status);
    const error=new Error(message);
    error.data=data;
    throw error;
  }
  return data;
}
async function loadState(silent){
  try{
    STATE=await api('/api/state');
  }catch(e){
    if(!silent)toast('无法连接本地服务：'+e.message,'err');
    return;
  }
  if(SELECTED_KEY===undefined||(SELECTED_KEY!==null&&!STATE.keys.some(k=>k.id===SELECTED_KEY))){
    const reason=SELECTED_KEY===undefined?'initialize':'source-removed';
    SELECTED_KEY=STATE.keys.length?STATE.keys[0].id:null;
    DRAFT=null;
    console.info('ui key selection reason='+reason+' source='+(SELECTED_KEY||'official'));
  }
  if(OVERVIEW_SOURCE!=='official'&&!STATE.keys.some(k=>k.id===OVERVIEW_SOURCE)){
    OVERVIEW_SOURCE='official';
    console.info('ui overview selection reason=source-removed source=official');
  }
  applyTheme(STATE.settings.theme);
  writeThemeCache(STATE.settings.theme);
  syncDockVisibility();
  seedImageOverrides();
  if(silent)renderQuiet();else render();
}
function seedImageOverrides(){
  if(IMAGE_READY||!STATE)return;
  STATE.models.forEach(m=>{if(!(m.input_modalities||['text','image']).includes('image'))IMAGE_OFF.add(m.upstream_model);});
  IMAGE_READY=true;
}
function imageOff(upstreamModel){
  return IMAGE_OFF.has(upstreamModel);
}
function nav(){
  // 轮询只更新状态，保留导航按钮节点和键盘焦点。
  if(NAV_PAGE===PAGE)return;
  document.getElementById('nav').innerHTML=NAV.map(([k,t])=>`<button type="button" id="nav-${k}" class="${k===PAGE?'on':''}" data-nav="${k}" aria-label="${esc(t)}" title="${esc(t)}" ${k===PAGE?'aria-current="page"':''}>${iconTile(...NAV_ICONS[k])}<span class="nav-label">${esc(t)}</span></button>`).join('');
  document.getElementById('title').textContent=TITLE[PAGE];
  NAV_PAGE=PAGE;
}
function foot(){
  if(!STATE){document.getElementById('foot').textContent='加载中…';return;}
  const running=STATE.router.running;
  document.getElementById('brand-sub').textContent=appVersionText(STATE)+' · '+(STATE.platform==='windows'?'Windows':'macOS');
  document.getElementById('foot').innerHTML=
    '路由 <b class="'+(running?'':'off')+'">'+(running?'运行中':'已停止')+'</b><br>'+
    '自启'+(STATE.settings.autostart?'已开启':'未开启');
  const pill=document.getElementById('top-pill');
  if(STATE.taken_over){pill.className='pill ok';pill.textContent='● 已接管';}
  else{pill.className='pill';pill.textContent='○ 官方直连';}
}
function toastTask(){
  const task=STATE&&STATE.task;
  if(!task)return '';
  if(task.status==='running')return `<span class="spin"></span> ${esc(taskKind(task.kind))}中…`;
  if(task.status==='error')return `<span class="tag err">上次失败</span>`;
  return '';
}
function taskKind(kind){
  return {refresh:'刷新模型列表',enable:'启用路由',stop:'停止路由',direct:'切回官方直连',discover:'拉取 Key 模型',discover_official:'拉取官方模型'}[kind]||'处理';
}
async function submit(path,label){
  if(BUSY)return;
  BUSY=true;render();
  try{
    await api(path,{method:'POST',body:{}});
    toast(label+'已开始','ok');
    await pollTask();
  }catch(e){toast(e.message,'err');}
  BUSY=false;
  await loadState(true);
}
async function pollTask(){
  for(let i=0;i<600;i++){
    await new Promise(r=>setTimeout(r,900));
    try{STATE=await api('/api/state');}catch(e){continue;}
    if(STATE.task&&STATE.task.status!=='running'){
      if(STATE.task.status==='done'){
        if(STATE.task.kind==='discover'){
          const detail=STATE.task.detail||{};
          // 拉取成功后丢掉旧的勾选缓存，用最新模型清单重建列表。
          if(detail.key_id===SELECTED_KEY)DRAFT=null;
          await loadState(true);
          toast('拉取完成：发现 '+(detail.discovered==null?'?':detail.discovered)+' 个模型，已刷新列表','ok');
        }else if(STATE.task.kind==='discover_official'){
          const detail=STATE.task.detail||{};
          await loadState(true);
          toast('官方模型已拉取：'+(detail.discovered==null?'?':detail.discovered)+' 个模型'+(detail.restart_pending?'；请手动重启 Codex 使新模型生效':''),'ok');
        }else{
          toast(taskKind(STATE.task.kind)+'完成','ok');
        }
      }else toast(taskKind(STATE.task.kind)+'失败：'+(STATE.task.message||''),'err');
      render();
      return;
    }
    render();
  }
}

function priorityMap(){
  if(PENDING_PRIORITY)return PENDING_PRIORITY;
  const map=Object.assign({},STATE.model_priority||{});
  PENDING_PRIORITY=map;
  return map;
}
function priorityRows(){
  const map=priorityMap();
  const names={};
  STATE.keys.forEach(k=>names[k.id]=k.name);
  const known=new Set();
  const rows=[];
  STATE.models.forEach(model=>{
    if(known.has(model.upstream_model))return;
    known.add(model.upstream_model);
    const candidates=STATE.conflicts.filter(c=>c.model===model.upstream_model).map(c=>c.candidates).flat();
    rows.push({model:model.upstream_model,defaultSource:model.source,candidates:candidates.length?candidates:[model.source]});
  });
  STATE.conflicts.forEach(c=>{
    if(known.has(c.model))return;
    known.add(c.model);
    rows.push({model:c.model,defaultSource:c.candidates[0],candidates:c.candidates});
  });
  return rows.map(row=>{
    const chosen=map[row.model]||row.defaultSource;
    const others=row.candidates.filter(id=>id!==chosen);
    const options=[`<option value="" ${map[row.model]?'':'selected'}>默认（按 Key 顺序）</option>`];
    if(row.candidates.includes('official')||chosen==='official'){
      options.push(`<option value="official" ${map[row.model]==='official'?'selected':''}>ChatGPT 官方账号</option>`);
    }
    row.candidates.filter(id=>id!=='official').forEach(id=>{
      options.push(`<option value="${esc(id)}" ${map[row.model]===id?'selected':''}>${esc(names[id]||id)}</option>`);
    });
    const officialNote=chosen==='official'?'<span class="tag blue">走官方账号</span>':'';
    const override=row.candidates.includes('official')&&chosen!=='official'?'<span class="tag blue">Key 覆盖官方，可改回</span>':'';
    return `<tr>
      <td><b>${esc(row.model)}</b></td>
      <td><select id="priority-${esc(row.model)}" data-action="set-priority" data-model="${esc(row.model)}" aria-label="${esc(row.model)} 的模型来源">${options.join('')}</select></td>
      <td class="mono">${others.length?esc(others.map(id=>id==='official'?'ChatGPT 账号':(names[id]||id)).join('、')):'—'}</td>
      <td>${officialNote}${override||(others.length?'<span class="hint">固定使用，不自动切换</span>':'<span class="hint">仅一个来源</span>')}</td>
    </tr>`;
  }).join('');
}

  const map={};
  document.querySelectorAll('#page .scroll').forEach(el=>{if(el.id&&(el.scrollTop||el.scrollLeft))map[el.id]={top:el.scrollTop,left:el.scrollLeft};});
  return map;
}
function restoreInnerScroll(map){
  Object.keys(map).forEach(id=>{const el=document.getElementById(id);if(el){el.scrollTop=map[id].top;el.scrollLeft=map[id].left;}});
}
function drawPage(html){
  const page=document.getElementById('page');
  const active=document.activeElement;
  const focusId=active&&page.contains(active)?active.id:null;
  const scroll=page.scrollTop;
  const inner=captureInnerScroll();
  page.classList.toggle('overview-page',PAGE==='overview');
  page.innerHTML=html;
  syncContentGutter();
  PAGE_HTML=html;
  page.scrollTop=scroll;
  restoreInnerScroll(inner);
  if(focusId){const replacement=document.getElementById(focusId);if(replacement)replacement.focus({preventScroll:true});}
  const search=document.getElementById('model-search');
  if(search){
    // 只重画模型表格，输入框节点不动；中文输入法组合期间不重画，避免断字。
    search.oninput=()=>{SEARCH=search.value;if(!COMPOSING)renderModelTable();};
    search.addEventListener('compositionstart',()=>{COMPOSING=true;});
    search.addEventListener('compositionend',()=>{COMPOSING=false;SEARCH=search.value;renderModelTable();});
  }
}
function render(){
  nav();foot();
  drawPage(pageHtml());
}
function renderQuiet(){
  const page=document.getElementById('page');
  const active=document.activeElement;
  const editing=active&&page.contains(active)&&['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
  const html=pageHtml();
  nav();foot();
  // 内容没变（或用户正在输入）就完全不碰 DOM：列表滚动位置、勾选草稿、搜索词都不会被打断。
  if(editing||html===PAGE_HTML)return;
  console.debug('ui quiet redraw page='+PAGE+' reason=content-changed');
  drawPage(html);
}
/* --------------------------------------------------------- close dialog */
// Windows 关闭窗口时由原生侧调用：复用现有弹框问一次，再决定最小化还是退出。
// 原生侧 1.5 秒收不到回应就默认最小化，窗口不会因为页面卡住而关不掉。
let CLOSE_PENDING=false;
function answerCloseDialog(action){
  if(action!=='shown')CLOSE_PENDING=false;
  try{if(window.codexmkCloseChoice)window.codexmkCloseChoice(action);}catch(e){}
}
window.codexmkConfirmClose=function(){
  openModal(`
    <div class="box">
      <h3 id="modal-title">最小化，还是关闭工具？</h3>
      <div class="hint">最小化后路由继续运行。关闭工具会停止后台服务，保留 Codex 接管配置，下次启动恢复。</div>
      <div class="row" style="justify-content:flex-end;margin-top:18px">
        <button class="btn ghost" id="close-minimize" data-close-choice="minimize">最小化</button>
        <button class="btn primary" data-close-choice="quit">关闭工具</button>
      </div>
    </div>`,'close-minimize');
  CLOSE_PENDING=true;
  answerCloseDialog('shown');
};
/* ------------------------------------------------------------------ modal */
let MODAL_RETURN_FOCUS=null;
function openModal(markup,focusId){
  const modal=document.getElementById('modal');
  if(modal.className!=='modal on')MODAL_RETURN_FOCUS=document.activeElement;
  modal.innerHTML=markup;modal.className='modal on';
  document.getElementById('app').inert=true;
  document.getElementById(focusId).focus();
  console.info('ui dialog opened focus='+focusId);
}
function closeModal(){
  const modal=document.getElementById('modal');
  if(modal.className!=='modal on')return;
  modal.className='modal';modal.innerHTML='';document.getElementById('app').inert=false;
  const target=MODAL_RETURN_FOCUS&&(MODAL_RETURN_FOCUS.isConnected?MODAL_RETURN_FOCUS:document.getElementById(MODAL_RETURN_FOCUS.id))||document.getElementById('nav-'+PAGE);
  if(target)target.focus({preventScroll:true});
  MODAL_RETURN_FOCUS=null;
  console.info('ui dialog closed');
}
function keyError(message,fieldId){
  document.getElementById('key-error').textContent=message;
  if(fieldId){const field=document.getElementById(fieldId);field.setAttribute('aria-invalid','true');field.focus();}
  console.warn('ui key form rejected field='+String(fieldId||'request'));
}
function openKeyModal(key){
  openModal(`
    <div class="box">
      <h3 id="modal-title">${key?'编辑 Key':'添加 Key'}</h3>
      <div class="field"><label for="key-name">名称</label><input type="text" id="key-name" aria-required="true" aria-describedby="key-error" value="${esc(key?key.name:'')}" placeholder="例如：主力 Key"></div>
      <div class="field"><label for="key-secret">密钥${key?'（留空保留原密钥）':''}</label><input type="password" id="key-secret" aria-required="${!key}" aria-describedby="key-error" autocomplete="off" spellcheck="false" placeholder="sk-…"></div>
      <div class="field"><label for="key-upstream">上游地址</label><input type="text" id="key-upstream" spellcheck="false" value="${esc(key?key.upstream_base_url:'https://api.example.com/v1')}"></div>
      <div class="field-error" id="key-error" role="alert"></div>
      <div class="row" style="justify-content:flex-end;margin-top:18px">
        <button class="btn ghost" data-action="close-modal">取消</button>
        <button class="btn primary" data-action="save-key" data-id="${key?esc(key.id):''}">${icon('save')}保存</button>
      </div>
    </div>`,'key-name');
}
/* ------------------------------------------------------------------ events */
document.addEventListener('click',async event=>{
  const closeButton=event.target.closest('[data-close-choice]');
  if(closeButton){const choice=closeButton.getAttribute('data-close-choice');closeModal();answerCloseDialog(choice);return;}
  const navEl=event.target.closest('[data-nav]');
  if(navEl){PAGE=navEl.getAttribute('data-nav');PENDING_PRIORITY=null;SEARCH='';history.replaceState(null,'','?page='+PAGE);console.info('ui navigation page='+PAGE);render();document.getElementById('nav-'+PAGE).focus({preventScroll:true});return;}
  const target=event.target.closest('[data-action]');
  if(!target)return;
  const action=target.getAttribute('data-action');
  const key=currentKey();
  if(action==='close-modal'){closeModal();return;}
  if(action==='add-key'){openKeyModal(null);return;}
  if(action==='edit-key'&&key){openKeyModal(key);return;}
  if(action==='select-key'){SELECTED_KEY=target.getAttribute('data-id');DRAFT=null;SEARCH='';console.info('ui key selection reason=user source='+SELECTED_KEY);render();return;}
  if(action==='select-official'){SELECTED_KEY=null;DRAFT=null;SEARCH='';console.info('ui key selection reason=user source=official');render();return;}
  if(action==='select-overview-source'){
    OVERVIEW_SOURCE=target.getAttribute('data-source');
    const models=document.getElementById('overview-model-table');
    if(models)models.scrollTop=0;
    console.info('ui overview selection reason=user source='+OVERVIEW_SOURCE);
    render();return;
  }
  if(action==='toggle-model'){
    const draft=draftSelected();
    const model=target.getAttribute('data-model');
    if(draft.all){draft.set=new Set(draft.models);draft.all=false;}
    if(draft.set.has(model))draft.set.delete(model);else draft.set.add(model);
    renderModelTable();return;
  }
  if(action==='select-all'){const draft=draftSelected();draft.all=true;draft.set=new Set(draft.models);renderModelTable();return;}
  if(action==='clear-all'){const draft=draftSelected();draft.all=false;draft.set=new Set();renderModelTable();return;}
  if(action==='toggle-image'){
    const model=target.getAttribute('data-model');
    const enable=imageOff(model);
    if(enable)IMAGE_OFF.delete(model);else IMAGE_OFF.add(model);
    renderModelTable();
    try{
      await api('/api/models/overrides',{method:'PUT',body:{upstream_model:model,input_modalities:enable?['text','image']:['text']}});
      toast(enable?'已开启图片输入，刷新模型列表后生效':'已关闭图片输入，模型不会再收到图片，刷新模型列表后生效','ok');
    }catch(e){
      if(enable)IMAGE_OFF.add(model);else IMAGE_OFF.delete(model);
      renderModelTable();
      toast(e.message,'err');
    }
    return;
  }
  if(action==='save-models'&&key){
    const draft=draftSelected();
    const payload=draft.all?null:Array.from(draft.set);
    try{
      await api('/api/keys/'+encodeURIComponent(key.id)+'/models',{method:'PUT',body:{selected_models:payload}});
      toast('勾选已保存，点“概览 → 刷新模型列表”生效','ok');
      DRAFT=null;await loadState(true);
    }catch(e){toast(e.message,'err');}
    return;
  }
  if(action==='save-key'){
    if(target.disabled)return;
    const id=target.getAttribute('data-id');
    const name=document.getElementById('key-name').value.trim();
    const secret=document.getElementById('key-secret').value.trim();
    const upstream=document.getElementById('key-upstream').value.trim();
    if(!name){keyError('请填写名称','key-name');return;}
    if(!id&&!secret){keyError('请粘贴密钥','key-secret');return;}
    const errorBox=document.getElementById('key-error');
    errorBox.textContent='';
    document.getElementById('key-name').removeAttribute('aria-invalid');
    document.getElementById('key-secret').removeAttribute('aria-invalid');
    target.disabled=true;
    try{
      if(id){
        await api('/api/keys/'+encodeURIComponent(id),{method:'PUT',body:{name:name,api_key:secret,upstream_base_url:upstream}});
      }else{
        const secrets=secret.split(/[\r\n]+/).map(s=>s.trim()).filter(Boolean);
        for(let i=0;i<secrets.length;i++){
          const label=secrets.length>1?(name+' '+(i+1)):name;
          await api('/api/keys',{method:'POST',body:{name:label,api_key:secrets[i],upstream_base_url:upstream}});
        }
      }
      // 保存过程中可能已关闭或换成其他弹窗，结果只更新原表单。
      if(errorBox.isConnected)closeModal();
      console.info('ui key form saved mode='+(id?'edit':'add'));
      toast('已保存','ok');await loadState(true);
    }catch(e){if(errorBox.isConnected)keyError(e.message);else toast(e.message,'err');}
    finally{target.disabled=false;}
    return;
  }
  if(action==='delete-key'&&key){
    if(!confirm('确定删除 Key「'+key.name+'」？此操作不可撤销。'))return;
    try{await api('/api/keys/'+encodeURIComponent(key.id),{method:'DELETE'});if(SELECTED_KEY===key.id){SELECTED_KEY=undefined;DRAFT=null;}toast('已删除','ok');await loadState(true);}
    catch(e){toast(e.message,'err');}
    return;
  }
  if(action==='test-key'&&key){await submit('/api/keys/'+encodeURIComponent(key.id)+'/test','拉取 Key 模型');return;}
  if(action==='discover-official'){await submit('/api/official/models/discover','拉取官方模型');return;}
  if(action==='refresh'){await submit('/api/refresh','刷新模型列表');return;}
  if(action==='start'){await submit('/api/router/start','启用路由');return;}
  if(action==='stop'){await submit('/api/router/stop','停止路由');return;}
  if(action==='direct'){await submit('/api/router/direct','切回官方直连');return;}
  if(action==='save-priority'){
    try{
      const map={};
      Object.keys(priorityMap()).forEach(k=>{const v=priorityMap()[k];if(v)map[k]=v;});
      await api('/api/priority',{method:'PUT',body:{model_priority:map}});
      PENDING_PRIORITY=null;toast('优先级已保存，点“概览 → 刷新模型列表”生效','ok');await loadState(true);
    }catch(e){toast(e.message,'err');}
    return;
  }
  if(action==='toggle-autostart'){
    try{
      const data=await api('/api/settings',{method:'PUT',body:{autostart:!STATE.settings.autostart}});
      STATE.settings=data.settings||STATE.settings;
      toast(STATE.settings.autostart?'已开启开机自启动':'已关闭开机自启动','ok');
      await loadState(true);
    }catch(e){toast(e.message,'err');}
    return;
  }
  if(action==='toggle-hide-dock'){
    if(STATE.platform!=='macos'||SAVING_DOCK_VISIBILITY)return;
    const hidden=STATE.settings.hide_dock_icon===false;
    SAVING_DOCK_VISIBILITY=true;render();
    try{
      const data=await api('/api/settings',{method:'PUT',body:{hide_dock_icon:hidden}});
      if(!data.settings||data.settings.hide_dock_icon!==hidden){
        toast('后台服务版本过旧，程序坞设置没有保存，请重启工具后再试','err');
        return;
      }
      STATE.settings=data.settings;
      syncDockVisibility();
      toast(hidden?'已隐藏程序坞图标':'已显示程序坞图标','ok');
      console.info('ui hide dock icon saved value='+hidden);
    }catch(e){console.warn('ui hide dock icon save failed',e);toast(e.message,'err');}
    finally{SAVING_DOCK_VISIBILITY=false;render();}
    return;
  }
  if(action==='save-port'){
    const value=parseInt(document.getElementById('admin-port').value,10);
    try{
      await api('/api/settings',{method:'PUT',body:{admin_port:value}});
      toast('端口已保存，重启软件后生效','ok');await loadState(true);
    }catch(e){toast(e.message,'err');}
    return;
  }
  if(action==='set-theme'){
    const theme=target.getAttribute('data-theme')==='dark'?'dark':'light';
    if(STATE.settings.theme===theme)return;
    try{
      const data=await api('/api/settings',{method:'PUT',body:{theme:theme}});
      STATE.settings=data.settings||STATE.settings;
      if(STATE.settings.theme!==theme){
        // 旧后台服务会静默丢掉 theme；这里直接说明原因，别让按钮看着像坏了。
        toast('后台服务版本过旧，主题没有保存，请重启工具后再试','err');
        return;
      }
      applyTheme(STATE.settings.theme);
      writeThemeCache(STATE.settings.theme);
      toast(theme==='dark'?'已切换深色主题':'已切换浅色主题','ok');
      render();
    }catch(e){toast(e.message,'err');}
    return;
  }
  if(action==='open-logs'){
    try{await api('/api/system/open-logs',{method:'POST',body:{}});toast('已打开日志目录','ok');}
    catch(e){toast(e.message,'err');}
    return;
  }
});
document.addEventListener('toggle',event=>{
  if(event.target.id==='recent-events')RECENT_EVENTS_OPEN=event.target.open;
  else if(event.target.id==='diagnostics')DIAGNOSTICS_OPEN=event.target.open;
  else return;
  PAGE_HTML=pageHtml();
},true);
document.addEventListener('change',event=>{
  const target=event.target.closest('[data-action="set-priority"]');
  if(!target)return;
  const map=priorityMap();
  const model=target.getAttribute('data-model');
  const value=target.value;
  if(value)map[model]=value;else delete map[model];
  PENDING_PRIORITY=map;
  toast('已修改，记得点“保存优先级”','');
});
document.addEventListener('keydown',event=>{
  const modal=document.getElementById('modal');
  if(modal.className!=='modal on')return;
  // 兼容旧版 WebView 没有 inert 的情况，Tab 仍只能在弹窗里移动。
  if(event.key==='Tab'){
    const controls=Array.from(modal.querySelectorAll('button:not(:disabled),input,select,textarea'));
    if(!controls.length)return;
    const first=controls[0],last=controls[controls.length-1],active=document.activeElement;
    if(event.shiftKey&&(active===first||!modal.contains(active))){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&(active===last||!modal.contains(active))){event.preventDefault();first.focus();}
    return;
  }
  if(event.key!=='Escape')return;
  event.preventDefault();
  if(CLOSE_PENDING){closeModal();answerCloseDialog('minimize');return;}
  closeModal();
});
nav();foot();
loadState();
setInterval(()=>{if(!BUSY&&(!STATE||STATE.task.status!=='running'))loadState(true);},5000);
</script>
</body>
</html>
