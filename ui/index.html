<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 路由</title>
<link rel="icon" href="logo.png">
<style>
  :root{
    --bg:#f1f5fc; --panel:#ffffff; --panel2:#f8faff; --panel3:#edf2fc;
    --border:#dce5f3; --text:#1c293b; --muted:#526176; --muted2:#59677d;
    --accent:#3654d8; --accent-dim:#adc1fa; --ok:#137954; --warn:#986014; --err:#b52b36;
    --chip:#edf2fa; --hover:#f2f6ff; --input-bg:#ffffff; --selected:#edf0ff;
    --side-bg:linear-gradient(155deg,#397edd 0%,#3d63d9 48%,#6659ca 100%);
    --side-text:#ffffff; --nav-text:#19355e; --nav-selected:rgba(255,255,255,.86); --glass:rgba(255,255,255,.82);
    --control-border:#b7c6df; --switch-bg:#c4ccdc; --knob:#ffffff;
    --mask:rgba(20,36,65,.34); --shadow:rgba(35,66,130,.1); --knob-shadow:rgba(22,41,82,.2);
    --spin-track:rgba(54,84,216,.2); --spin-head:#3654d8;
    --tag-ok-bg:#e3f6ed; --tag-ok-fg:#126947; --tag-err-bg:#fdebef; --tag-err-fg:#a92332;
    --tag-warn-bg:#fff2de; --tag-warn-fg:#87520e; --tag-blue-bg:#e6eeff; --tag-blue-fg:#2951bd;
    --ok-border:#bee7d2; --err-border:#efc2cb; --blue-border:#cad8fb; --danger-border:#efc2cb;
    --cyan:#087c99; --cyan-soft:#e0f5fb; --violet:#6341bc; --violet-soft:#efebff;
    --blue:#2951bd; --blue-soft:#e6eeff; --amber:#986014; --amber-soft:#fff3df;
    --radius:16px; --space:24px; --in-oklab: ;
  }
  html[data-theme="dark"]{
    --bg:#111827; --panel:#1b2638; --panel2:#202d43; --panel3:#29374f;
    --border:#354761; --text:#edf3fc; --muted:#c3cee0; --muted2:#b0bed3;
    --accent:#496ff0; --accent-dim:#5a79b9; --ok:#63d7a4; --warn:#edbc65; --err:#ff949f;
    --chip:#29374f; --hover:#263750; --input-bg:#152034; --selected:#293756;
    --side-bg:linear-gradient(155deg,#244c78 0%,#273e72 48%,#443963 100%);
    --side-text:#edf3fc; --nav-text:#edf3fc; --nav-selected:rgba(33,48,78,.95); --glass:rgba(27,38,56,.94);
    --control-border:#637592; --switch-bg:#53617a; --knob:#ffffff;
    --mask:rgba(5,12,25,.7); --shadow:rgba(0,0,0,.24); --knob-shadow:rgba(0,0,0,.3);
    --spin-track:rgba(155,183,255,.25); --spin-head:#afc6ff;
    --tag-ok-bg:#153d30; --tag-ok-fg:#94e5bf; --tag-err-bg:#48252c; --tag-err-fg:#ffabb3;
    --tag-warn-bg:#47391f; --tag-warn-fg:#f6cf8c; --tag-blue-bg:#253d67; --tag-blue-fg:#bad0ff;
    --ok-border:#356b55; --err-border:#77414b; --blue-border:#466697; --danger-border:#77414b;
    --cyan:#8bddf2; --cyan-soft:#17394a; --violet:#c7b5ff; --violet-soft:#342a53;
    --blue:#bad0ff; --blue-soft:#253d67; --amber:#f6cf8c; --amber-soft:#47391f;
  }
  @supports (background:linear-gradient(in oklab,white,black)){:root{--in-oklab:in oklab;}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
  html[data-theme="dark"] body{color-scheme:dark}
  button,input,select,textarea{font:inherit}
  button{color:inherit}
  button:disabled{opacity:.5;cursor:not-allowed}
  :where(button,input,select,textarea,summary):focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .app{display:flex;height:100vh}
  .side{width:220px;flex:none;position:relative;isolation:isolate;overflow:hidden;background:var(--side-bg);color:var(--side-text);border-right:1px solid rgba(255,255,255,.55);display:flex;flex-direction:column}
  .side:before{content:"";position:absolute;z-index:-1;inset:-60px -120px 25%;border-radius:50%;background:radial-gradient(ellipse at 25% 20%,rgba(182,240,255,.2),transparent 60%);transform:rotate(-28deg);pointer-events:none}
  .brand{display:flex;align-items:center;gap:12px;padding:28px 20px 24px}
  .logo{width:36px;height:36px;border-radius:10px;display:block;flex:none}
  .brand b{font-size:21px;font-weight:650;letter-spacing:-.4px}
  .brand span{display:block;font-size:13px;margin-top:4px}
  .nav{padding:0 12px;display:flex;flex-direction:column;gap:8px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 12px;border:1px solid transparent;border-radius:16px;background:transparent;color:var(--side-text);text-align:left;font-weight:550;cursor:default}
  .nav button:hover{background:rgba(255,255,255,.18)}
  .nav button.on{background:var(--nav-selected);color:var(--nav-text);border-color:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 5px 14px var(--shadow)}
  .icon{display:block;width:20px;height:20px;flex:none}
  .icon-tile{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border-radius:11px;color:#fff;background:linear-gradient(145deg var(--in-oklab),#397deb,#244cbf);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 3px 7px rgba(26,54,113,.13);border:1px solid rgba(255,255,255,.35)}
  .icon-tile.cyan{background:linear-gradient(145deg var(--in-oklab),#109dbd,#087995)}
  .icon-tile.violet{background:linear-gradient(145deg var(--in-oklab),#8666e9,#5b38b5)}
  .icon-tile.amber{background:linear-gradient(145deg var(--in-oklab),#c98c27,#956010)}
  .side .foot{margin-top:auto;padding:20px;font-size:13px;line-height:1.9;border-top:1px solid rgba(255,255,255,.35)}
  .side .foot b{font-weight:650}.side .foot b.off{font-weight:400}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:radial-gradient(ellipse at top right,var(--blue-soft),transparent 60%)}
  .top{min-height:82px;display:flex;align-items:center;justify-content:space-between;padding:16px var(--space);gap:16px;background:var(--glass);border-bottom:1px solid var(--border)}
  .top h1{font-size:28px;font-weight:650;letter-spacing:-.6px}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted);white-space:nowrap}
  .pill.ok{color:var(--tag-ok-fg);border-color:var(--ok-border);background:var(--tag-ok-bg)}
  .pill.err{color:var(--tag-err-fg);border-color:var(--err-border);background:var(--tag-err-bg)}
  .body{padding:20px var(--space) var(--space);overflow:auto;flex:1;min-height:0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;min-width:0}
  .card h2{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;margin-bottom:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--control-border);background:var(--panel);color:var(--text);border-radius:11px;padding:8px 14px;font-size:14px;line-height:1.4;cursor:default;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);white-space:nowrap}
  .btn:hover{border-color:var(--accent-dim)}.btn:active:not(:disabled){background:var(--panel3)}
  .btn.primary{background:linear-gradient(160deg var(--in-oklab),#406de9,#304aca);border-color:#304aca;color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 10px var(--shadow)}
  .btn.primary:active:not(:disabled){background:#304aca}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.danger{color:var(--tag-err-fg);border-color:var(--danger-border);box-shadow:none}
  .btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
  .actionbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--border);border-radius:16px;background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 5px 14px var(--shadow)}
  .actionbar .btn{flex:1}
  @supports ((backdrop-filter:blur(8px)) or (-webkit-backdrop-filter:blur(8px))){.top,.actionbar,.nav button.on{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}}
  table{width:100%;border-collapse:collapse}
  th{font-size:13px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:var(--panel3);white-space:nowrap}
  td{padding:12px;border-top:1px solid var(--border);font-size:14px;vertical-align:middle}
  tbody tr:hover td{background:var(--hover)}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;background:var(--chip);color:var(--muted);font-size:13px;white-space:nowrap}
  .tag.ok{background:var(--tag-ok-bg);color:var(--tag-ok-fg)}.tag.err{background:var(--tag-err-bg);color:var(--tag-err-fg)}
  .tag.warn{background:var(--tag-warn-bg);color:var(--tag-warn-fg)}.tag.blue{background:var(--tag-blue-bg);color:var(--tag-blue-fg)}
  .tag.violet{background:var(--violet-soft);color:var(--violet)}
  .mono{font-family:"SF Mono",Consolas,Menlo,monospace;font-size:13px;color:var(--muted);overflow-wrap:anywhere;user-select:text}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1}
  .split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
  .keylist{display:flex;flex-direction:column;gap:8px}
  .keyitem,.overview-source{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:var(--panel2);border-radius:12px;padding:12px;text-align:left;cursor:default;min-width:0}
  .keyitem:hover,.overview-source:hover{background:var(--hover)}
  .keyitem.on,.overview-source.on{border-color:var(--accent-dim);background:var(--selected);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
  .source-copy{min-width:0;flex:1}.source-copy .name{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}
  .source-copy .meta{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
  .check{display:block;width:20px;height:20px;accent-color:var(--accent);cursor:default;flex:none}
  .check-cell{text-align:center}.check-cell .check{margin:auto}
  .searchbox{background:var(--input-bg);border:1px solid var(--control-border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:14px;width:240px;max-width:100%;min-width:120px}
  .searchbox::placeholder{color:var(--muted2)}
  .switch{width:44px;height:26px;border-radius:999px;background:var(--switch-bg);position:relative;display:inline-block;cursor:default;border:1px solid var(--control-border);flex:none}
  .switch:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--knob);top:2px;left:2px;box-shadow:0 1px 3px var(--knob-shadow);transition:left .15s}
  .switch.on{background:var(--accent);border-color:var(--accent)}.switch.on:after{left:20px}
  .seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--border);border-radius:11px;background:var(--panel3);flex:none}
  .seg button{border:0;background:transparent;color:var(--muted);font-size:14px;padding:6px 16px;border-radius:8px;cursor:default}
  .seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 5px var(--shadow)}
  .settings{max-width:880px;display:flex;flex-direction:column;gap:16px}
  .setting{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-top:1px solid var(--border);gap:16px}
  .setting:first-of-type{border-top:0;padding-top:0}.setting:last-child{padding-bottom:0}
  .setting>div:first-child{min-width:0}.setting .l{font-size:15px;font-weight:550}
  .setting .d{font-size:13px;color:var(--muted2);margin-top:4px;line-height:1.6;overflow-wrap:anywhere}
  .hint{font-size:13px;color:var(--muted2);line-height:1.7}
  .helper-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
  .connection-info{display:grid;gap:6px;padding:12px 0 16px;margin-bottom:16px;border-bottom:1px solid var(--border)}
  .panel-heading{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.panel-heading h2{margin:0;max-width:100%;overflow-wrap:anywhere}
  .model-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  #model-table table{min-width:570px}#model-table td:nth-child(2){overflow-wrap:anywhere;max-width:260px}
  .priority-table table{min-width:600px}.priority-table td:first-child{overflow-wrap:anywhere}
  select{background:var(--input-bg);border:1px solid var(--control-border);border-radius:9px;padding:8px 10px;color:var(--text);font-size:14px;max-width:100%;width:100%}
  input[type=text],input[type=password],input[type=number]{background:var(--input-bg);border:1px solid var(--control-border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:14px;width:100%}
  input:focus,select:focus,.searchbox:focus{border-color:var(--accent)}
  .port-control{display:flex;gap:8px;flex:none;align-items:center}.port-control input{width:110px}
  .modal{position:fixed;inset:0;background:var(--mask);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
  .modal.on{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:24px;width:460px;max-width:100%;max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 16px 48px var(--shadow)}
  .modal h3{font-size:20px;margin-bottom:16px}.field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:550;margin-bottom:6px}
  .field-error{font-size:14px;color:var(--tag-err-fg);margin:12px 0}.field-error:empty{display:none}
  .field input[aria-invalid="true"]{border-color:var(--err)}
  .toast{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
  .toast div{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:14px;max-width:min(420px,calc(100vw - 48px));box-shadow:0 6px 20px var(--shadow)}
  .toast div.err{border-color:var(--err-border);color:var(--tag-err-fg)}.toast div.ok{border-color:var(--ok-border);color:var(--tag-ok-fg)}
  .empty{padding:32px 16px;text-align:center;color:var(--muted2);font-size:14px}
  .scroll{max-height:360px;overflow:auto;scrollbar-gutter:stable}
  .body.overview-page{overflow:hidden;padding-bottom:20px}
  .overview{height:100%;display:flex;flex-direction:column;gap:16px}
  .overview-service{padding:0;border:0;background:transparent;flex:none}
  .service-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .service-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.service-status strong{font-size:17px}
  .overview-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:6px;border:1px solid var(--border);border-radius:16px;background:var(--panel);flex:none}
  .overview-stat{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;min-width:0;color:var(--blue);background:var(--blue-soft)}
  .overview-stat.cyan{color:var(--cyan);background:var(--cyan-soft)}.overview-stat.violet{color:var(--violet);background:var(--violet-soft)}.overview-stat.amber{color:var(--amber);background:var(--amber-soft)}
  .overview-stat .n{display:block;font-size:28px;font-weight:650;line-height:1.15;font-variant-numeric:tabular-nums}
  .overview-stat .k{display:block;color:var(--text);font-size:13px;margin-top:4px;white-space:nowrap}
  .overview-stat .icon-tile{width:40px;height:40px;border-radius:12px}
  .overview-sources{display:flex;flex-direction:column;flex:1;min-height:200px;padding:0;overflow:hidden}
  .sources-title{padding:16px 20px;border-bottom:1px solid var(--border)}.sources-title h2{margin:0}
  .sources-layout{display:grid;grid-template-columns:220px minmax(0,1fr);flex:1;min-height:0}
  .source-list{max-height:none;padding:12px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--border);background:var(--panel2)}
  .overview-source{flex:none}.source-models{display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px 20px}
  .source-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.source-heading h3{font-size:17px;font-weight:650;overflow-wrap:anywhere}
  .overview-model-table{max-height:none;flex:1;min-height:0}.overview-model-table table{table-layout:fixed;min-width:330px}
  .overview-model-table th{position:sticky;top:0;background:var(--panel3);z-index:1}.overview-model-table td:first-child{overflow-wrap:anywhere}
  .recent-events{padding:12px 20px;flex:none}.recent-events summary{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;cursor:default;list-style:none}
  .recent-events summary::-webkit-details-marker{display:none}.recent-events summary:after{content:"+";margin-left:auto;color:var(--muted)}.recent-events[open] summary:after{content:"−"}
  .recent-events .scroll{max-height:110px;margin-top:12px}.recent-events .mono{margin-bottom:6px}
  .diagnostics summary{display:flex;align-items:center;gap:10px;cursor:default;font-weight:600}.diagnostics[open] summary{margin-bottom:16px}
  @media(max-width:1100px){
    :root{--space:20px}.side{width:190px}.brand{padding:24px 16px}.brand b{font-size:18px}
    .nav button{padding:10px;gap:10px;font-size:14px}.overview-stat{gap:8px;padding:12px 8px}.overview-stat .icon-tile{width:32px;height:32px}
    .sources-layout{grid-template-columns:190px minmax(0,1fr)}.split{grid-template-columns:minmax(0,1fr)}
    .keylist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  }
  @media(max-height:700px),(max-width:900px){
    .body.overview-page{overflow:auto}.overview{height:auto;min-height:100%}.overview-sources{height:420px;flex:none}
    .overview-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.actionbar .btn{flex:1 1 40%}
  }
  @media(max-width:740px){
    :root{--space:12px}.side{width:72px}.brand{justify-content:center;padding:20px 8px}.brand-copy,.nav-label,.side .foot{display:none}
    .nav{padding:0 8px}.nav button{padding:8px;justify-content:center;min-height:54px}.nav .icon-tile{width:36px;height:36px}
    .top{min-height:70px;padding:12px}.top h1{font-size:24px}.pill{padding:6px 10px}
    .sources-layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    .source-list{flex-direction:row;align-items:flex-start;border-right:0;border-bottom:1px solid var(--border);max-height:110px}.overview-source{width:200px;align-items:flex-start}
    .overview-sources{height:500px}.source-models{padding:12px}.card{padding:16px}.overview-sources{padding:0}
    .keylist{grid-template-columns:minmax(0,1fr)}.setting{flex-wrap:wrap}.setting>div:first-child{flex:1 1 180px}
    .model-toolbar .searchbox{flex:1 1 100%}.overview-stat{gap:8px}.overview-stat .k{font-size:13px;white-space:normal}
  }
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  @media(prefers-reduced-transparency:reduce){.top,.actionbar,.nav button.on{background:var(--panel);backdrop-filter:none;-webkit-backdrop-filter:none}}
  @media(forced-colors:active){.icon-tile{background:Canvas;color:CanvasText;border-color:CanvasText;box-shadow:none}.nav button.on{border-color:Highlight}.btn,.card{box-shadow:none}}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--spin-track);border-top-color:var(--spin-head);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <img class="logo" src="logo.png" alt="">
      <div class="brand-copy"><b>Codex 路由</b><span id="brand-sub">版本读取中 · 本地服务</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="foot" id="foot">加载中…</div>
  </aside>
  <div class="main">
    <div class="top">
      <h1 id="title"></h1>
      <div id="top-pill" class="pill">● 读取中</div>
    </div>
    <div class="body" id="page"></div>
  </div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const NAV=[['overview','概览'],['keys','Key 与模型'],['priority','路由优先级'],['settings','设置']];
const TITLE={overview:'概览',keys:'Key 与模型',priority:'路由优先级',settings:'设置'};
const ICONS={

function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function errText(data,fallback){
  const code=data&&data.code;
  if(code&&ERROR_TEXT[code])return ERROR_TEXT[code]+(data.error?'（'+data.error+'）':'');
  return (data&&data.error)||fallback||'操作失败';
}
function toast(message,kind){
  const box=document.getElementById('toast');
  const item=document.createElement('div');
  item.className=kind||'';
  item.textContent=message;
  box.appendChild(item);

}
async function api(path,options){
  const opts=Object.assign({headers:{}},options||{});
  if(opts.body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}
  let response;
  try{
    response=await fetch(path,opts);
  }catch(e){
    // WebKit reports refused/aborted connections as the bare English string
    // "Load failed"; show something readable and keep the raw error in console.
    console.warn('api request failed',path,e);
    const error=new Error('本地服务连接中断，请稍后重试');
    error.data=null;
    throw error;
  }
  let data=null;
  try{data=await response.json();}catch(e){data=null;}
  if(!response.ok||(data&&data.ok===false)){
    const message=errText(data,'HTTP '+response.status);
    const error=new Error(message);
    error.data=data;
    throw error;
  }
  return data;
}
async function loadState(silent){
  try{
    STATE=await api('/api/state');

    if(!silent)toast('无法连接本地服务：'+e.message,'err');

  }
  if(SELECTED_KEY===undefined||(SELECTED_KEY!==null&&!STATE.keys.some(k=>k.id===SELECTED_KEY))){
    const reason=SELECTED_KEY===undefined?'initialize':'source-removed';
    SELECTED_KEY=STATE.keys.length?STATE.keys[0].id:null;
    DRAFT=null;
    console.info('ui key selection reason='+reason+' source='+(SELECTED_KEY||'official'));
  }
  if(OVERVIEW_SOURCE!=='official'&&!STATE.keys.some(k=>k.id===OVERVIEW_SOURCE)){
    OVERVIEW_SOURCE='official';
    console.info('ui overview selection reason=source-removed source=official');
  }
  applyTheme(STATE.settings.theme);
  writeThemeCache(STATE.settings.theme);
  syncDockVisibility();
  seedImageOverrides();
  if(silent)renderQuiet();else render();
}

  const task=STATE&&STATE.task;
  if(!task)return '';
  if(task.status==='running')return `<span class="spin"></span> ${esc(taskKind(task.kind))}中…`;
  if(task.status==='error')return `<span class="tag err">上次失败</span>`;

}
async function submit(path,label){
  if(BUSY)return;
  BUSY=true;render();
  try{
    await api(path,{method:'POST',body:{}});
    toast(label+'已开始','ok');
    await pollTask();
  }catch(e){toast(e.message,'err');}
  BUSY=false;
  await loadState(true);
}
async function pollTask(){
  for(let i=0;i<600;i++){
    await new Promise(r=>setTimeout(r,900));
    try{STATE=await api('/api/state');}catch(e){continue;}
    if(STATE.task&&STATE.task.status!=='running'){
      if(STATE.task.status==='done'){
        if(STATE.task.kind==='discover'){
          const detail=STATE.task.detail||{};
          // 拉取成功后丢掉旧的勾选缓存，用最新模型清单重建列表。
          if(detail.key_id===SELECTED_KEY)DRAFT=null;
          await loadState(true);
          toast('拉取完成：发现 '+(detail.discovered==null?'?':detail.discovered)+' 个模型，已刷新列表','ok');
        }else if(STATE.task.kind==='discover_official'){
          const detail=STATE.task.detail||{};
          await loadState(true);
          toast('官方模型已拉取：'+(detail.discovered==null?'?':detail.discovered)+' 个模型'+(detail.restart_pending?'；请手动重启 Codex 使新模型生效':''),'ok');
        }else{
          toast(taskKind(STATE.task.kind)+'完成','ok');
        }
      }else toast(taskKind(STATE.task.kind)+'失败：'+(STATE.task.message||''),'err');
      render();
      return;
    }
    render();
  }
}

function draftSelected(){
  const key=currentKey();
  if(!key)return null;
  const models=keyModels(key);
  const stamp=models.join('\u0000');
  if(DRAFT&&DRAFT.keyId===key.id&&DRAFT.stamp===stamp)return DRAFT;
  const selected=key.selected_models===null?null:new Set(key.selected_models);
  DRAFT={keyId:key.id,stamp,models,all:selected===null,set:selected===null?new Set(models):selected};
  return DRAFT;
}
function keyModels(key){
  const models=(key.discovered_models||[]).slice();
  (key.selected_models||[]).forEach(m=>{if(!models.includes(m))models.push(m);});

/* ---------------------------------------------------------------- priority */
function priorityMap(){
  if(PENDING_PRIORITY)return PENDING_PRIORITY;
  const map=Object.assign({},STATE.model_priority||{});
  PENDING_PRIORITY=map;
  return map;
}
function priorityRows(){
  const map=priorityMap();
  const names={};
  STATE.keys.forEach(k=>names[k.id]=k.name);
  const known=new Set();
  const rows=[];
  STATE.models.forEach(model=>{
    if(known.has(model.upstream_model))return;
    known.add(model.upstream_model);
    const candidates=STATE.conflicts.filter(c=>c.model===model.upstream_model).map(c=>c.candidates).flat();
    rows.push({model:model.upstream_model,defaultSource:model.source,candidates:candidates.length?candidates:[model.source]});
  });
  STATE.conflicts.forEach(c=>{
    if(known.has(c.model))return;
    known.add(c.model);
    rows.push({model:c.model,defaultSource:c.candidates[0],candidates:c.candidates});
  });
  return rows.map(row=>{
    const chosen=map[row.model]||row.defaultSource;
    const others=row.candidates.filter(id=>id!==chosen);
    const options=[`<option value="" ${map[row.model]?'':'selected'}>默认（按 Key 顺序）</option>`];
    if(row.candidates.includes('official')||chosen==='official'){
      options.push(`<option value="official" ${map[row.model]==='official'?'selected':''}>ChatGPT 官方账号</option>`);
    }
    row.candidates.filter(id=>id!=='official').forEach(id=>{
      options.push(`<option value="${esc(id)}" ${map[row.model]===id?'selected':''}>${esc(names[id]||id)}</option>`);
    });
    const officialNote=chosen==='official'?'<span class="tag blue">走官方账号</span>':'';
    const override=row.candidates.includes('official')&&chosen!=='official'?'<span class="tag blue">Key 覆盖官方，可改回</span>':'';
    return `<tr>
      <td><b>${esc(row.model)}</b></td>
      <td><select id="priority-${esc(row.model)}" data-action="set-priority" data-model="${esc(row.model)}" aria-label="${esc(row.model)} 的模型来源">${options.join('')}</select></td>
      <td class="mono">${others.length?esc(others.map(id=>id==='official'?'ChatGPT 账号':(names[id]||id)).join('、')):'—'}</td>
      <td>${officialNote}${override||(others.length?'<span class="hint">固定使用，不自动切换</span>':'<span class="hint">仅一个来源</span>')}</td>
    </tr>`;
  }).join('');
}

function pageHtml(){

// #model-table 这类 .scroll 是独立滚动容器，整页重建会把它们打回顶部，重建前后原样搬一次。
function captureInnerScroll(){
  const map={};
  document.querySelectorAll('#page .scroll').forEach(el=>{if(el.id&&(el.scrollTop||el.scrollLeft))map[el.id]={top:el.scrollTop,left:el.scrollLeft};});
  return map;
}
function restoreInnerScroll(map){
  Object.keys(map).forEach(id=>{const el=document.getElementById(id);if(el){el.scrollTop=map[id].top;el.scrollLeft=map[id].left;}});
}
function drawPage(html){
  const page=document.getElementById('page');
  const active=document.activeElement;
  const focusId=active&&page.contains(active)?active.id:null;
  const scroll=page.scrollTop;
  const inner=captureInnerScroll();
  page.classList.toggle('overview-page',PAGE==='overview');
  page.innerHTML=html;
  PAGE_HTML=html;
  page.scrollTop=scroll;
  restoreInnerScroll(inner);
  if(focusId){const replacement=document.getElementById(focusId);if(replacement)replacement.focus({preventScroll:true});}
  const search=document.getElementById('model-search');
  if(search){
    // 只重画模型表格，输入框节点不动；中文输入法组合期间不重画，避免断字。
    search.oninput=()=>{SEARCH=search.value;if(!COMPOSING)renderModelTable();};
    search.addEventListener('compositionstart',()=>{COMPOSING=true;});
    search.addEventListener('compositionend',()=>{COMPOSING=false;SEARCH=search.value;renderModelTable();});
  }
}
function render(){
  nav();foot();
  drawPage(pageHtml());
}
function renderQuiet(){
  const page=document.getElementById('page');
  const active=document.activeElement;
  const editing=active&&page.contains(active)&&['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
  const html=pageHtml();
  nav();foot();
  // 内容没变（或用户正在输入）就完全不碰 DOM：列表滚动位置、勾选草稿、搜索词都不会被打断。
  if(editing||html===PAGE_HTML)return;
  console.debug('ui quiet redraw page='+PAGE+' reason=content-changed');
  drawPage(html);
}

/* ------------------------------------------------------------------ modal */
let MODAL_RETURN_FOCUS=null;
function openModal(markup,focusId){
  const modal=document.getElementById('modal');
  if(modal.className!=='modal on')MODAL_RETURN_FOCUS=document.activeElement;
  modal.innerHTML=markup;modal.className='modal on';
  document.getElementById('app').inert=true;
  document.getElementById(focusId).focus();
  console.info('ui dialog opened focus='+focusId);
}
function closeModal(){
  const modal=document.getElementById('modal');
  if(modal.className!=='modal on')return;
  modal.className='modal';modal.innerHTML='';document.getElementById('app').inert=false;
  const target=MODAL_RETURN_FOCUS&&(MODAL_RETURN_FOCUS.isConnected?MODAL_RETURN_FOCUS:document.getElementById(MODAL_RETURN_FOCUS.id))||document.getElementById('nav-'+PAGE);
  if(target)target.focus({preventScroll:true});
  MODAL_RETURN_FOCUS=null;
  console.info('ui dialog closed');
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click',async event=>{
  const closeButton=event.target.closest('[data-close-choice]');
  if(closeButton){const choice=closeButton.getAttribute('data-close-choice');closeModal();answerCloseDialog(choice);return;}
  const navEl=event.target.closest('[data-nav]');
  if(navEl){PAGE=navEl.getAttribute('data-nav');PENDING_PRIORITY=null;SEARCH='';history.replaceState(null,'','?page='+PAGE);console.info('ui navigation page='+PAGE);render();document.getElementById('nav-'+PAGE).focus({preventScroll:true});return;}
  const target=event.target.closest('[data-action]');
  if(!target)return;
  const action=target.getAttribute('data-action');
  const key=currentKey();
  if(action==='close-modal'){closeModal();return;}
  if(action==='add-key'){openKeyModal(null);return;}
  if(action==='edit-key'&&key){openKeyModal(key);return;}
  if(action==='select-key'){SELECTED_KEY=target.getAttribute('data-id');DRAFT=null;SEARCH='';console.info('ui key selection reason=user source='+SELECTED_KEY);render();return;}
  if(action==='select-official'){SELECTED_KEY=null;DRAFT=null;SEARCH='';console.info('ui key selection reason=user source=official');render();return;}
  if(action==='select-overview-source'){
    OVERVIEW_SOURCE=target.getAttribute('data-source');
    const models=document.getElementById('overview-model-table');
    if(models)models.scrollTop=0;
    console.info('ui overview selection reason=user source='+OVERVIEW_SOURCE);
    render();return;
  }
  if(action==='toggle-model'){
    const draft=draftSelected();
    const model=target.getAttribute('data-model');
    if(draft.all){draft.set=new Set(draft.models);draft.all=false;}
    if(draft.set.has(model))draft.set.delete(model);else draft.set.add(model);
    renderModelTable();return;
  }
  if(action==='select-all'){const draft=draftSelected();draft.all=true;draft.set=new Set(draft.models);renderModelTable();return;}
  if(action==='clear-all'){const draft=draftSelected();draft.all=false;draft.set=new Set();renderModelTable();return;}
  if(action==='toggle-image'){
    const model=target.getAttribute('data-model');
    const enable=imageOff(model);
    if(enable)IMAGE_OFF.delete(model);else IMAGE_OFF.add(model);
    renderModelTable();
    try{
      await api('/api/models/overrides',{method:'PUT',body:{upstream_model:model,input_modalities:enable?['text','image']:['text']}});
      toast(enable?'已开启图片输入，刷新模型列表后生效':'已关闭图片输入，模型不会再收到图片，刷新模型列表后生效','ok');
    }catch(e){
      if(enable)IMAGE_OFF.add(model);else IMAGE_OFF.delete(model);
      renderModelTable();
      toast(e.message,'err');
    }
    return;
  }
  if(action==='save-models'&&key){
    const draft=draftSelected();
    const payload=draft.all?null:Array.from(draft.set);
    try{
      await api('/api/keys/'+encodeURIComponent(key.id)+'/models',{method:'PUT',body:{selected_models:payload}});
      toast('勾选已保存，点“概览 → 刷新模型列表”生效','ok');
      DRAFT=null;await loadState(true);
    }catch(e){toast(e.message,'err');}
    return;
  }
  if(action==='save-key'){
    if(target.disabled)return;
    const id=target.getAttribute('data-id');
    const name=document.getElementById('key-name').value.trim();
    const secret=document.getElementById('key-secret').value.trim();
    const upstream=document.getElementById('key-upstream').value.trim();
    if(!name){keyError('请填写名称','key-name');return;}
    if(!id&&!secret){keyError('请粘贴密钥','key-secret');return;}
    const errorBox=document.getElementById('key-error');
    errorBox.textContent='';
    document.getElementById('key-name').removeAttribute('aria-invalid');
    document.getElementById('key-secret').removeAttribute('aria-invalid');

      if(id){
        await api('/api/keys/'+encodeURIComponent(id),{method:'PUT',body:{name:name,api_key:secret,upstream_base_url:upstream}});
      }else{
        const secrets=secret.split(/[\r\n]+/).map(s=>s.trim()).filter(Boolean);
        for(let i=0;i<secrets.length;i++){
          const label=secrets.length>1?(name+' '+(i+1)):name;
          await api('/api/keys',{method:'POST',body:{name:label,api_key:secrets[i],upstream_base_url:upstream}});
        }
      }
      // 保存过程中可能已关闭或换成其他弹窗，结果只更新原表单。

      toast('已保存','ok');await loadState(true);

  if(action==='start'){await submit('/api/router/start','启用路由');return;}
  if(action==='stop'){await submit('/api/router/stop','停止路由');return;}
  if(action==='direct'){await submit('/api/router/direct','切回官方直连');return;}
  if(action==='save-priority'){
    try{
      const map={};
      Object.keys(priorityMap()).forEach(k=>{const v=priorityMap()[k];if(v)map[k]=v;});
      await api('/api/priority',{method:'PUT',body:{model_priority:map}});
      PENDING_PRIORITY=null;toast('优先级已保存，点“概览 → 刷新模型列表”生效','ok');await loadState(true);
    }catch(e){toast(e.message,'err');}

      STATE.settings=data.settings||STATE.settings;
      toast(STATE.settings.autostart?'已开启开机自启动':'已关闭开机自启动','ok');
      await loadState(true);
    }catch(e){toast(e.message,'err');}

    if(STATE.platform!=='macos'||SAVING_DOCK_VISIBILITY)return;
    const hidden=STATE.settings.hide_dock_icon===false;
    SAVING_DOCK_VISIBILITY=true;render();
    try{
      const data=await api('/api/settings',{method:'PUT',body:{hide_dock_icon:hidden}});
      if(!data.settings||data.settings.hide_dock_icon!==hidden){
        toast('后台服务版本过旧，程序坞设置没有保存，请重启工具后再试','err');

    finally{SAVING_DOCK_VISIBILITY=false;render();}

  }
  if(action==='save-port'){
    const value=parseInt(document.getElementById('admin-port').value,10);
    try{
      await api('/api/settings',{method:'PUT',body:{admin_port:value}});
      toast('端口已保存，重启软件后生效','ok');await loadState(true);
    }catch(e){toast(e.message,'err');}
    return;
  }
  if(action==='set-theme'){
    const theme=target.getAttribute('data-theme')==='dark'?'dark':'light';
    if(STATE.settings.theme===theme)return;
    try{
      const data=await api('/api/settings',{method:'PUT',body:{theme:theme}});
      STATE.settings=data.settings||STATE.settings;
      if(STATE.settings.theme!==theme){
        // 旧后台服务会静默丢掉 theme；这里直接说明原因，别让按钮看着像坏了。
        toast('后台服务版本过旧，主题没有保存，请重启工具后再试','err');
        return;
      }
      applyTheme(STATE.settings.theme);
      writeThemeCache(STATE.settings.theme);
      toast(theme==='dark'?'已切换深色主题':'已切换浅色主题','ok');
      render();
    }catch(e){toast(e.message,'err');}
    return;
  }
  if(action==='open-logs'){
    try{await api('/api/system/open-logs',{method:'POST',body:{}});toast('已打开日志目录','ok');}
    catch(e){toast(e.message,'err');}
    return;
  }
});
document.addEventListener('toggle',event=>{
  if(event.target.id==='recent-events')RECENT_EVENTS_OPEN=event.target.open;
  else if(event.target.id==='diagnostics')DIAGNOSTICS_OPEN=event.target.open;
  else return;
  PAGE_HTML=pageHtml();
},true);
document.addEventListener('change',event=>{
  const target=event.target.closest('[data-action="set-priority"]');
  if(!target)return;
  const map=priorityMap();
  const model=target.getAttribute('data-model');
  const value=target.value;
  if(value)map[model]=value;else delete map[model];
  PENDING_PRIORITY=map;
  toast('已修改，记得点“保存优先级”','');
});
document.addEventListener('keydown',event=>{
  const modal=document.getElementById('modal');
  if(modal.className!=='modal on')return;
  // 兼容旧版 WebView 没有 inert 的情况，Tab 仍只能在弹窗里移动。
  if(event.key==='Tab'){
    const controls=Array.from(modal.querySelectorAll('button:not(:disabled),input,select,textarea'));
    if(!controls.length)return;
    const first=controls[0],last=controls[controls.length-1],active=document.activeElement;
    if(event.shiftKey&&(active===first||!modal.contains(active))){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&(active===last||!modal.contains(active))){event.preventDefault();first.focus();}
    return;
  }
  if(event.key!=='Escape')return;
  event.preventDefault();
  if(CLOSE_PENDING){closeModal();answerCloseDialog('minimize');return;}
  closeModal();
});
nav();foot();
loadState();
setInterval(()=>{if(!BUSY&&(!STATE||STATE.task.status!=='running'))loadState(true);},5000);
</script>
