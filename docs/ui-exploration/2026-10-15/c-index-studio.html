<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · 索引工作室</title>
<style>
:root{--ink:#17382f;--muted:#62746d;--mint:#e5f2e9;--green:#235847;--paper:#fbfcf8;--line:#dbe5dc;--radius:10px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #478c73;outline-offset:3px}button:disabled{cursor:default;opacity:.38}.app{width:1180px;height:820px;overflow:hidden;display:grid;grid-template-rows:76px 118px 66px 1fr 54px}
.topbar{display:flex;align-items:center;padding:0 38px;gap:54px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:650;white-space:nowrap}.brand svg{width:28px;height:28px}.nav{display:flex;align-self:stretch;gap:32px}.nav button{padding:0 2px;background:none;border:0;color:var(--muted);position:relative;font-size:14px}.nav button.active{color:var(--ink);font-weight:650}.nav button.active:after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--green)}.version{margin-left:auto;color:var(--muted);font-size:12px}
.heading{display:flex;align-items:center;padding:18px 38px;gap:28px}.heading h1{margin:0;font-family:"Songti SC","STSong","SimSun",Georgia,serif;font-size:42px;font-weight:650;letter-spacing:1px;line-height:1.2}.heading p{margin:8px 0 0;color:var(--muted);font-size:13px}.counts{display:flex;gap:31px;margin-left:auto}.count{min-width:84px}.count strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:400;line-height:1.2}.count span{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.controlbar{display:flex;align-items:center;margin:0 38px;padding:0 0 18px;border-bottom:1px solid var(--line);gap:10px}.state{display:flex;align-items:center;gap:8px;font-weight:600}.dot{width:7px;height:7px;border-radius:50%;background:#377b5d}.takeover{margin-left:12px;padding:5px 10px;border-radius:5px;background:var(--mint);font-size:12px;color:var(--green)}.actions{display:flex;gap:8px;margin-left:auto}.btn{height:34px;padding:0 13px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);display:flex;align-items:center;gap:6px;font-size:13px}.btn svg{width:14px;height:14px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.quiet{background:transparent}
.workspace{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:24px 38px 20px;min-height:0}.sources{background:var(--mint);border-radius:var(--radius);padding:24px 16px;display:flex;flex-direction:column;min-height:0}.sources h2{font-size:14px;font-weight:600;margin:0 12px 20px}.source{width:100%;background:transparent;border:0;border-radius:7px;padding:16px 13px;text-align:left;display:flex;align-items:center;gap:12px;color:var(--ink)}.source svg{width:19px;height:19px;flex:none;color:#547669}.source.active{background:#fff;box-shadow:0 3px 12px #17382f08}.source-text{min-width:0;flex:1}.source strong{display:block;font-size:14px;font-weight:600}.source small{display:block;margin-top:5px;font-size:12px;color:var(--muted)}.source .amount{font-family:Georgia,serif;font-size:21px;color:#446154}.source .selected{width:5px;height:5px;border-radius:50%;background:var(--green)}.source-note{margin:auto 12px 0;padding-top:22px;color:#425e50;font-size:12px;line-height:1.8}
.catalog{min-width:0;display:flex;flex-direction:column}.catalog-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}.catalog-head h2{margin:0;font-size:23px;letter-spacing:-.4px}.configured{font-size:12px;color:#517b61;display:flex;align-items:center;gap:5px}.configured:before{content:"";width:5px;height:5px;background:#517b61;border-radius:50%}.catalog-head .total{margin-left:auto;font-size:12px;color:var(--muted)}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.model{min-width:0;border:1px solid var(--line);border-radius:8px;padding:14px 17px;background:#fff;display:grid;grid-template-columns:1fr 28px;gap:11px 8px;min-height:76px}.model strong{font-size:15px;font-weight:550;letter-spacing:-.1px;white-space:nowrap}.model .wire{color:var(--muted);font-size:12px}.model svg{grid-column:2;grid-row:1 / span 2;width:24px;height:24px;align-self:center;color:#b3c9bb}.model.responses{background:#f2f7f1;border-color:#dde9dc}.model.responses svg{color:#7b9d87}
.events{margin-top:auto;padding-top:18px;display:grid;grid-template-columns:80px 1fr;gap:10px}.events h3{font-size:12px;font-weight:500;color:var(--muted);margin:3px 0 0}.event-list{display:flex;flex-direction:column;gap:7px}.event{display:flex;gap:14px;font-size:12px;color:var(--muted)}.event time{font-variant-numeric:tabular-nums;color:#83948b}.event:first-child{color:var(--ink)}
.footer{border-top:1px solid var(--line);padding:0 38px;display:flex;align-items:center;font-size:12px;color:var(--muted)}.footer .mode{margin-left:auto;display:flex;align-items:center;gap:6px}.footer svg{width:13px;height:13px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M6 5v12a5 5 0 0 0 5 5h11M6 11h11a5 5 0 0 0 5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="6" cy="5" r="3" fill="currentColor"/><circle cx="22" cy="5" r="3" fill="currentColor"/><circle cx="22" cy="22" r="3" fill="currentColor"/></svg><span>Codex 路由</span></div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <span class="version" id="version"></span>
  </header>
  <section class="heading" aria-label="概览摘要">
    <div><h1>概览</h1><p>模型来自哪里，一眼看清。</p></div>
    <div class="counts" id="counts"></div>
  </section>
  <section class="controlbar" aria-label="路由控制">
    <div class="state"><span class="dot"></span>路由运行中</div><span class="takeover">已接管 Codex</span>
    <div class="actions" id="actions"></div>
  </section>
  <main class="workspace">
    <aside class="sources" aria-labelledby="source-title"><h2 id="source-title">模型来源</h2><div id="sources"></div><div class="source-note">官方账号与 Key 分开管理。<br>选择来源，查看接入的模型。</div></aside>
    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-head"><h2 id="catalog-title">主力 Key</h2><span class="configured">已配置</span><span class="total">7 个模型</span></div>
      <div class="model-grid" id="models" role="list"></div>
      <section class="events" aria-label="最近事件"><h3>最近事件</h3><div class="event-list" id="events"></div></section>
    </section>
  </main>
  <footer class="footer"><span>模型目录由来源提供，刷新后生效。</span><span class="mode"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 7V4a3 3 0 0 1 6 0v3M4 7h8v7H4z" stroke="currentColor" stroke-width="1.3"/></svg>固定来源 · 失败不自动切换</span></footer>
</div>
<script src="data.js"></script>
<script>
const data=window.ROUTER_PREVIEW;
const symbols={refresh:'<path d="M13 4v4H9M3 12V8h4M4 4a5 5 0 0 1 8 1M4 11a5 5 0 0 0 8 1"/>',power:'<path d="M8 2v6M4 4a6 6 0 1 0 8 0"/>',stop:'<rect x="4" y="4" width="8" height="8" rx="1"/>',direct:'<path d="M2 12V9a4 4 0 0 1 4-4h8m-4-3 4 3-4 3"/>'};
function svg(body,view='0 0 16 16'){return `<svg viewBox="${view}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;}
document.getElementById('nav').innerHTML=data.nav.map((name,index)=>`<button type="button" class="${index===0?'active':''}" ${index===0?'aria-current="page"':''}>${name}</button>`).join('');
document.getElementById('version').textContent=`v${data.version} · 本地服务`;
document.getElementById('counts').innerHTML=data.counts.map(item=>`<div class="count"><strong>${item.value}</strong><span>${item.label}</span></div>`).join('');
document.getElementById('actions').innerHTML=data.actions.map((name,index)=>`<button type="button" class="btn ${index===0?'primary':'quiet'}" ${index===1?'disabled':''}>${svg(symbols[['refresh','power','stop','direct'][index]])}${name}</button>`).join('');
document.getElementById('sources').innerHTML=data.sources.map((source,index)=>`<button type="button" class="source ${source.selected?'active':''}" aria-pressed="${!!source.selected}">${svg(index===0?'<path d="M4 12H3a3 3 0 0 1 0-6 5 5 0 0 1 9-1 4 4 0 0 1 0 7H9"/>':'<circle cx="10" cy="5" r="3"/><path d="m8 7-6 6v-3h3V7"/>')}<span class="source-text"><strong>${source.name}</strong><small>${source.state}</small></span><span class="amount" aria-label="${source.count} 个模型">${source.count}</span>${source.selected?'<span class="selected"></span>':''}</button>`).join('');
document.getElementById('models').innerHTML=data.models.map(model=>`<article role="listitem" class="model ${model.wire==='原生直通'?'responses':''}"><strong>${model.name}</strong><span class="wire">${model.wire}</span>${svg('<path d="m3 5 5-3 5 3-5 3zM3 9l5 3 5-3M3 12l5 3 5-3"/>')}</article>`).join('');
document.getElementById('events').innerHTML=data.events.map(event=>`<div class="event"><time>${event.time}</time><span>${event.message}</span></div>`).join('');
console.info('ui-preview direction=C viewport=1180x820 data=synthetic backend=disconnected');
</script>
</body>
</html>
